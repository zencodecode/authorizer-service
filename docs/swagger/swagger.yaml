basePath: /api
host: localhost:8080
info:
  contact:
    name: Zencode
  description: OAuth2/OIDC Authorization Server API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Log Service API
  version: 1.0.0
paths:
  /oauth2/authorize:
    post:
      consumes:
      - application/json
      description: Generate authorization code
      parameters:
      - in: formData
        name: client_id
        required: true
        type: string
      - in: formData
        name: code_challenge
        required: true
        type: string
      - in: formData
        name: code_challenge_method
        required: true
        type: string
      - in: formData
        name: redirect_uri
        required: true
        type: string
      - in: formData
        name: response_type
        required: true
        type: string
      - in: formData
        name: scope
        required: true
        type: string
      - in: formData
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAccessToken: []
      summary: Authorize user
      tags:
      - Authorize
securityDefinitions:
  BearerAccessToken:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
